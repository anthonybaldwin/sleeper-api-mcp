name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: bun-linux-x64
          - os: ubuntu-latest
            platform: linux-arm64
            target: bun-linux-aarch64
          - os: macos-latest
            platform: macos-x64
            target: bun-darwin-x64
          - os: macos-latest
            platform: macos-arm64
            target: bun-darwin-aarch64
          - os: windows-latest
            platform: windows-x64
            target: bun-windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build executable
        run: bun build src/index.ts --compile --target=${{ matrix.target }} --outfile sleeper-mcp

      - name: Rename artifact with platform
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == windows* ]]; then
            # Rename to sleeper-mcp-windows-x64.exe
            mv sleeper-mcp.exe sleeper-mcp-${{ matrix.platform }}.exe
          else
            # Rename to sleeper-mcp-{platform}
            mv sleeper-mcp sleeper-mcp-${{ matrix.platform }}
            chmod +x sleeper-mcp-${{ matrix.platform }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sleeper-mcp-${{ matrix.platform }}
          path: sleeper-mcp-${{ matrix.platform }}${{ contains(matrix.platform, 'windows') && '.exe' || '' }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: ls -R artifacts

      # Tag pushes publish to that tag's release; manual runs update the "latest" release
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          body: Automated build from [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: artifacts/*
          fail_on_unmatched_files: true
